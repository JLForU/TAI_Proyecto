{% extends "base.html" %}
{% block title %}Discovery · Sentinel{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Discovery</h1>

<div class="card bg-base-100 shadow mb-6 max-w-xl">
  <div class="card-body">
    <h2 class="card-title">Descubrir un host</h2>
    <form method="post" action="/ui/discovery" class="flex gap-2"
          hx-post="/ui/discovery" hx-target="#discovery-panel" hx-swap="innerHTML">
      <input class="input input-bordered flex-1" name="host" placeholder="192.168.1.10" required>
      <button class="btn btn-primary" type="submit">Descubrir</button>
    </form>
    <p class="text-xs opacity-70">El alcance real (allowlist) lo valida U4 — hasta entonces un host válido puede devolver «fuera de alcance».</p>
  </div>
</div>

<div id="discovery-panel">
  {% include "discovery_panel.html" %}
</div>
{% endblock %}
