<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sentinel network report</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 2rem;
      color: #16202a;
      line-height: 1.5;
    }
    table { border-collapse: collapse; width: 100%; margin: 0.5rem 0 1rem; }
    th, td { border: 1px solid #c7ccd1; padding: 0.3rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #eef1f3; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    h1, h2 { page-break-after: avoid; color: #0f1b24; }
    h1 { border-bottom: 2px solid #2f7a6e; padding-bottom: 0.4rem; }
    table { page-break-inside: auto; }
    tr { page-break-inside: avoid; }
  </style>
</head>
<body>
{{ body | safe }}
</body>
</html>
