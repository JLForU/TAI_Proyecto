<!doctype html>
<html lang="es" data-theme="sentinel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sentinel — inventario, eventos y alertas de red en tiempo real.">
  <title>{% block title %}Sentinel{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
  <link rel="stylesheet" href="/static/css/daisyui.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="min-h-screen" style="background: hsl(var(--b1)); color: hsl(var(--bc));">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-input" style="position:absolute;opacity:0;pointer-events:none;">

  <div class="app-shell">
    <label for="sidebar-toggle" class="sidebar-scrim" aria-hidden="true"></label>

    <aside class="app-sidebar">
      <div class="app-brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M12 2.5 4 5.8v5.3c0 5 3.2 8.6 8 10.4 4.8-1.8 8-5.4 8-10.4V5.8L12 2.5Z" stroke-linejoin="round"/>
          <path d="M9 12.3l2.1 2.1L15.5 10" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>
          Sentinel
          <span class="brand-sub">monitoreo de red</span>
        </span>
      </div>

      <nav class="app-nav" aria-label="Navegación principal" data-sentinel-nav>
        <a class="app-nav-link" href="/ui/assets" id="nav-assets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="5.5" rx="1"/><rect x="3.5" y="14.5" width="17" height="5.5" rx="1"/><circle cx="6.5" cy="6.25" r=".6" fill="currentColor" stroke="none"/><circle cx="6.5" cy="17.25" r=".6" fill="currentColor" stroke="none"/></svg>
          Inventario
        </a>
        <a class="app-nav-link" href="/ui/events" id="nav-events">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2.2-6.5L13 18l2-8h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Eventos
        </a>
        <a class="app-nav-link" href="/ui/alerts" id="nav-alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5c-3.3 0-5 2.4-5 5.6 0 4.6-1.5 6-2.3 6.6H19.3c-.8-.6-2.3-2-2.3-6.6 0-3.2-1.7-5.6-5-5.6Z" stroke-linejoin="round"/><path d="M9.7 19.3a2.4 2.4 0 0 0 4.6 0" stroke-linecap="round"/></svg>
          Alertas
        </a>
        <a class="app-nav-link" href="/ui/health" id="nav-health">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 12.5h4l1.8-4 2.6 7 1.8-5H20.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Salud
        </a>
        <a class="app-nav-link" href="/ui/discovery" id="nav-discovery">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M16.3 16.3 20.5 20.5" stroke-linecap="round"/></svg>
          Discovery
        </a>
        <a class="app-nav-link" href="/ui/report" id="nav-report">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 3.5h8l3 3v14h-11z" stroke-linejoin="round"/><path d="M9 11h6M9 14.5h6M9 7.5h2.5" stroke-linecap="round"/></svg>
          Reporte
        </a>
      </nav>

      <div class="app-nav-foot">
        <a class="btn btn-sm btn-outline w-full" href="/api/v1/export?format=csv" id="nav-export">Export CSV</a>
        <form method="post" action="/ui/reset" class="mt-2"
              onsubmit="return confirm('¿Resetear el escenario? Se borrarán inventario, observaciones, eventos, alertas, baselines y discovery. Los pods y la configuración no se tocan.');">
          <button class="btn btn-sm btn-error w-full" type="submit" id="nav-reset">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12a8 8 0 1 0 2.3-5.7" stroke-linecap="round"/><path d="M4 4v4.5H8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Resetear escenario
          </button>
        </form>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <label for="sidebar-toggle" class="btn btn-sm btn-ghost sidebar-toggle" aria-label="Abrir navegación">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
        </label>
        <h1>{% block page_title %}{% endblock %}</h1>
      </header>

      <main class="app-content" id="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/discovery.js"></script>
  <script>
    (function () {
      "use strict";
      var path = window.location.pathname;
      document.querySelectorAll("[data-sentinel-nav] .app-nav-link").forEach(function (link) {
        var href = link.getAttribute("href");
        if (href && (path === href || path.indexOf(href + "/") === 0)) {
          link.classList.add("is-active");
        }
      });
    })();
  </script>
</body>
</html>
