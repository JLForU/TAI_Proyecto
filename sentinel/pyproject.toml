[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — sensor activo de red, un solo binario, dos modos"
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "Proprietary" }

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = [
    "contexto",
    "aidlc-docs",
    "aidlc-docs.old-20261003",
    "entradas.old-20260926",
    ".aidlc-rule-details",
    "fill-answers.py",
    "fill-story-answers.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI inyecta dependencias con Depends() en defaults de parámetro (patrón
# oficial del framework); B008 no aplica a la capa de rutas/deps.
"src/sentinel/core/api/*.py" = ["B008"]
"src/sentinel/gui/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

[tool.mypy]
python_version = "3.11"
files = ["src/sentinel"]
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
