apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-core-data
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.core.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-core
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: sentinel-core
spec:
  selector:
    app.kubernetes.io/name: sentinel-core
  ports:
    - name: http-api
      port: {{ .Values.core.ports.httpApi }}
      targetPort: http-api
    - name: metrics
      port: {{ .Values.core.ports.metrics }}
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-core
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: sentinel-core
spec:
  replicas: {{ .Values.core.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-core
    spec:
      containers:
        - name: core
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.core.command }}
          ports:
            - name: http-api
              containerPort: {{ .Values.core.ports.httpApi }}
            - name: metrics
              containerPort: {{ .Values.core.ports.metrics }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http-api
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http-api
          volumeMounts:
            - name: data
              mountPath: {{ .Values.core.persistence.mountPath }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sentinel-core-data
