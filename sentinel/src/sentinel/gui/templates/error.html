{% extends "base.html" %}
{% block title %}{{ vm.title }} · Sentinel{% endblock %}
{% block content %}
<div class="hero min-h-[50vh]">
  <div class="hero-content text-center">
    <div>
      <p class="text-6xl font-bold opacity-30">{{ vm.status }}</p>
      <h1 class="text-3xl font-bold mt-2">{{ vm.title }}</h1>
      <p class="mt-3 opacity-80">{{ vm.detail }}</p>
      {% if vm.code %}
        <p class="mt-1 text-sm opacity-60"><code>{{ vm.code }}</code></p>
      {% endif %}
      <a class="btn btn-primary mt-6" href="/ui/assets">Volver a la GUI</a>
    </div>
  </div>
</div>
{% endblock %}
